<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body class="container">
    <div id="loader">
        <div id="loader-glow"></div>

        <svg id="loader-heart" viewBox="0 0 32 32">
            <path
                d="M23.6 2c-3.363 0-6.258 2.736-7.599 5.594-1.342-2.858-4.237-5.594-7.601-5.594-4.637 0-8.4 3.764-8.4 8.401 0 9.433 9.516 11.906 16.001 21.232 6.13-9.268 15.999-12.1 15.999-21.232 0-4.637-3.763-8.401-8.4-8.401z">
            </path>
        </svg>

        <p id="loader-title">blooming for you</p>
        <p id="loader-subtitle">gathering every petal...</p>

        <div id="loader-bar-track">
            <div id="loader-bar-fill"></div>
        </div>

        <p id="loader-percent">0%</p>
    </div>

    <div class="night"></div>

    <div class="love-message">
        <p class="love-message__eyebrow">F O R &nbsp; Y O U</p>
        <h1 class="love-message__title">
            <span>Every flower here</span><br>
            <span class="love-message__line-with-heart">
                is a moment with you
                <svg class="title-heart" viewBox="0 0 32 32">
                    <path
                        d="M23.6 2c-3.363 0-6.258 2.736-7.599 5.594-1.342-2.858-4.237-5.594-7.601-5.594-4.637 0-8.4 3.764-8.4 8.401 0 9.433 9.516 11.906 16.001 21.232 6.13-9.268 15.999-12.1 15.999-21.232 0-4.637-3.763-8.401-8.4-8.401z">
                    </path>
                </svg>
            </span>
        </h1>
    </div>

    <!-- Fireflies floating above flowers -->
    <div class="fireflies">
        <div class="firefly" style="top: 58%; left: 46%; animation-delay: 0.2s;"></div>
        <div class="firefly" style="top: 62%; left: 52%; animation-delay: 1.4s;"></div>
        <div class="firefly" style="top: 65%; left: 38%; animation-delay: 0.7s;"></div>
        <div class="firefly" style="top: 60%; left: 60%; animation-delay: 2.1s;"></div>
        <div class="firefly" style="top: 55%; left: 42%; animation-delay: 1.8s;"></div>
        <div class="firefly" style="top: 70%; left: 54%; animation-delay: 2.7s;"></div>
        <div class="firefly" style="top: 68%; left: 32%; animation-delay: 0.9s;"></div>
        <div class="firefly" style="top: 64%; left: 68%; animation-delay: 3.1s;"></div>
        <div class="firefly" style="top: 52%; left: 50%; animation-delay: 1.1s;"></div>
    </div>

                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>

                <div class="flower-top-heart">

                <div class="flower__light flower__light--1"></div>
                <div class="flower__light flower__light--2"></div>
                <div class="flower__light flower__light--3"></div>
                <div class="flower__light flower__light--4"></div>
                <div class="flower__light flower__light--5"></div>
                <div class="flower__light flower__light--6"></div>
                <div class="flower__light flower__light--7"></div>
                <div class="flower__light flower__light--8"></div>

            <div class="flower__line">

                <div class="flower__line__leaf flower__line__leaf--3"></div>

                <div class="flower__line__leaf flower__line__leaf--5"></div>
                <div class="flower__line__leaf flower__line__leaf--6"></div>
            </div>
        </div>

        <div class="flower flower--2">

                <div class="flower__light flower__light--4"></div>

        <div class="flower flower--3">

                <div class="flower__light flower__light--1"></div>
                <div class="flower__light flower__light--2"></div>
                <div class="flower__light flower__light--3"></div>
                <div class="flower__light flower__light--4"></div>
                <div class="flower__light flower__light--5"></div>

                <div class="flower__line__leaf flower__line__leaf--4"></div>

        <div class="flower flower--4">

                <div class="flower__leaf flower__leaf--1"></div>

        <div class="grow-ans" style="--d:1.2s">
            <div class="flower__g-long">
                <div class="flower__g-long__top"></div>
                <div class="flower__g-long__bottom"></div>
            </div>
        </div>

        <!-- Grass Heart nestled in lower left grass -->
        <div class="grass-heart">
            <svg viewBox="0 0 32 32">
                <path
                    d="M23.6 2c-3.363 0-6.258 2.736-7.599 5.594-1.342-2.858-4.237-5.594-7.601-5.594-4.637 0-8.4 3.764-8.4 8.401 0 9.433 9.516 11.906 16.001 21.232 6.13-9.268 15.999-12.1 15.999-21.232 0-4.637-3.763-8.401-8.4-8.401z">
                </path>
            </svg>
        </div>

        <div class="growing-grass">
            <div class="flower__grass flower__grass--1">
                <div class="flower__grass--top"></div>
                <div class="flower__grass--bottom"></div>
                <div class="flower__grass__leaf flower__grass__leaf--1"></div>
                <div class="flower__grass__leaf flower__grass__leaf--2"></div>
                <div class="flower__grass__leaf flower__grass__leaf--3"></div>

            </div>
        </div>

        <div class="grow-ans" style="--d:2.4s">

        </div>

        <div class="grow-ans" style="--d:2.8s">

        <div class="grow-ans" style="--d:2.8s">
            <div class="flower__g-front">
                <div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--1">
                    <div class="flower__g-front__leaf"></div>
                </div>
                <div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--2">
                    <div class="flower__g-front__leaf"></div>
                </div>
                <div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--3">

                <div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--4">

                </div>
                <div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--5">
                    <div class="flower__g-front__leaf"></div>
                </div>
                <div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--6">

                </div>
                <div class="flower__g-front__leaf-wrapper flower__g-front__leaf-wrapper--7">

                <div class="flower__g-front__line"></div>
            </div>
        </div>

        <div class="grow-ans" style="--d:3.2s">
            <div class="flower__g-fr">
                <div class="leaf"></div>
                <div class="flower__g-fr__leaf flower__g-fr__leaf--1"></div>
                <div class="flower__g-fr__leaf flower__g-fr__leaf--2"></div>

                <div class="flower__g-fr__leaf flower__g-fr__leaf--4"></div>
                <div class="flower__g-fr__leaf flower__g-fr__leaf--5"></div>

                <div class="flower__g-fr__leaf flower__g-fr__leaf--7"></div>
                <div class="flower__g-fr__leaf flower__g-fr__leaf--8"></div>
            </div>
        </div>

        <div class="long-g long-g--0">
            <div class="grow-ans" style="--d:3s">
                <div class="leaf leaf--0"></div>
            </div>
            <div class="grow-ans" style="--d:2.2s">
                <div class="leaf leaf--1"></div>
            </div>
            <div class="grow-ans" style="--d:3.4s">
                <div class="leaf leaf--2"></div>
            </div>
            <div class="grow-ans" style="--d:3.6s">
                <div class="leaf leaf--3"></div>
            </div>
        </div>

            <div class="grow-ans" style="--d:3.6s">
                <div class="leaf leaf--0"></div>

            </div>
            <div class="grow-ans" style="--d:4s">
                <div class="leaf leaf--2"></div>
            </div>
            <div class="grow-ans" style="--d:4.2s">

            </div>
        </div>

        <div class="long-g long-g--2">

    <!-- Floating Bubbles matching video -->
    <div class="bubbles">
        <!-- Emerald Ring with Pink Heart inside (top-left) -->

            </svg>
        </div>

        <!-- Plain Floating Heart (top right) -->

        <!-- Emerald Ring Bubble without Heart (right) -->

        <!-- Emerald Ring with Pink Heart (mid-left) -->

            <svg class="heart" viewBox="0 0 32 32">
                <path d="M23.6 2c-3.363 0-6.258 2.736-7.599 5.594-1.342-2.858-4.237-5.594-7.601-5.594-4.637 0-8.4 3.764-8.4 8.401 0 9.433 9.516 11.906 16.001 21.232 6.13-9.268 15.999-12.1 15.999-21.232 0-4.637-3.763-8.401-8.4-8.401z"></path>

            </svg>
        </div>

        <!-- Small Emerald Ring with Heart (center) -->
        <div class="bubble bubble--ring-heart" style="left: 48%; animation-duration: 16s; animation-delay: 2.0s; width: 24px; height: 24px;">
            <svg class="heart" viewBox="0 0 32 32">
                <path d="M23.6 2c-3.363 0-6.258 2.736-7.599 5.594-1.342-2.858-4.237-5.594-7.601-5.594-4.637 0-8.4 3.764-8.4 8.401 0 9.433 9.516 11.906 16.001 21.232 6.13-9.268 15.999-12.1 15.999-21.232 0-4.637-3.763-8.401-8.4-8.401z"></path>
            </svg>
        </div>

        <!-- Delicate Emerald Ring (center-right) -->
        <div class="bubble bubble--ring" style="left: 68%; animation-duration: 19s; animation-delay: 5.0s; width: 22px; height: 22px;"></div>

        <!-- Floating Pink Heart (center-left) -->

                <path d="M23.6 2c-3.363 0-6.258 2.736-7.599 5.594-1.342-2.858-4.237-5.594-7.601-5.594-4.637 0-8.4 3.764-8.4 8.401 0 9.433 9.516 11.906 16.001 21.232 6.13-9.268 15.999-12.1 15.999-21.232 0-4.637-3.763-8.401-8.4-8.401z"></path>

        <!-- Lower-left Emerald Ring with Heart -->
        <div class="bubble bubble--ring-heart" style="left: 12%; animation-duration: 20s; animation-delay: 7.5s; width: 32px; height: 32px;">

        <!-- Small Emerald Ring (far right) -->
        <div class="bubble bubble--ring" style="left: 93%; animation-duration: 16s; animation-delay: 8.5s; width: 20px; height: 20px;"></div>
    </div>
